<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Kvartální Hodnocení</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    body { font-family: 'Segoe UI', sans-serif; background:#f0f0f0; margin:0; padding:20px; color:#000; }

    .page {
      background:#fff;
      width:210mm;
      min-height:297mm;
      margin:0 auto 20px;
      padding:20mm;
      box-shadow:0 0 10px rgba(0,0,0,.1);
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
    }

    @media print {
      body { background:none; padding:0; }
      .page { box-shadow:none; margin:0; padding:15mm; }
      .no-print { display:none!important; }
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }

    .header {
      border-bottom:2px solid #000;
      padding-bottom:10px;
      margin-bottom:30px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
    }

    .logo-img {
      height:90px;
      max-width:300px;
      object-fit:contain;
      margin-bottom:10px;
      display:block;
    }

    h1 { margin:0; font-size:24px; text-transform:uppercase; letter-spacing:1px; }
    .meta-date { text-align:right; font-size:14px; font-weight:bold; margin-top:5px; }

    .dashboard {
      display:flex;
      gap:30px;
      margin-bottom:30px;
      align-items:stretch;
    }

    .score {
      flex:0 0 30%;
      background:#f4f4f4;
      border-left:6px solid #000;
      padding:15px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .score-val { font-size:36px; font-weight:bold; line-height:1; }
    .score-lbl { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#555; margin-top:6px; }

    /* --- KPI BOXES: match annual audit style --- */
    .kpis {
      flex:1;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      align-items:stretch;
    }

    .alert-box {
      background:#fff;
      border:1px solid #000;
      padding:10px;
      text-align:center;
      display:flex;
      flex-direction:column;
      justify-content:center;
      position:relative;
    }
    .alert-num {
      font-size:24px;
      font-weight:bold;
      line-height:1.1;
      color:#000;
    }
    .alert-label {
      font-size:11px;
      text-transform:uppercase;
      color:#000;
      margin-top:6px;
      letter-spacing:1px;
    }

    h3 { font-size:14px; text-transform:uppercase; border-bottom:1px solid #ccc; margin:0 0 6px 0; padding-bottom:4px; }

    table { width:100%; border-collapse:collapse; font-size:11px; margin-top:10px; }
    th, td { border:1px solid #000; padding:6px; vertical-align:top; }
    th { background:#eee; font-weight:bold; text-transform:uppercase; text-align:left; }

    .problem-text { font-weight:bold; }

    thead { display:table-header-group; }
    tr { page-break-inside:avoid; break-inside:avoid; }

    .footer {
      margin-top:auto;
      border-top:1px solid #000;
      padding-top:10px;
      font-size:10px;
      color:#333;
      display:flex;
      justify-content:space-between;
    }

    .langbar {
      max-width:210mm;
      margin:0 auto 10px;
      display:flex;
      justify-content:center;
      gap:10px;
      align-items:center;
      font-weight:bold;
    }
    .langbar select { padding:6px 10px; border:1px solid #000; border-radius:6px; background:#fff; }

    .btn-print {
      width:220px;
      margin:0 auto 20px;
      padding:10px;
      background:#333;
      color:#fff;
      text-align:center;
      cursor:pointer;
      border-radius:5px;
      font-weight:bold;
    }
    .btn-print:hover { background:#000; }
  </style>
</head>

<body>
<div style="position:fixed;top:6px;left:6px;background:#ff0;padding:4px 8px;border:1px solid #000;z-index:99999;font-weight:700;">
  VERSION: KPI-FONT-FIX-TEST
</div>

  
  <div class="no-print langbar">
    <label>
      Jazyk:
      <select id="langSelect" aria-label="Language">
        <option value="cz">CZ</option>
        <option value="en">EN</option>
        <option value="de">DE</option>
      </select>
    </label>
  </div>

  <div class="no-print btn-print" onclick="window.print()">🖨️ Print</div>

  <div class="page" id="report">
    <div style="text-align:center; padding-top:150px; color:#888;">Načítám data…</div>
  </div>

<script>
/* ================= LANGUAGE ================= */

let UI_LANG = "cz";
let LAST_RECORD = null;
const LS_KEY = "kvartal_lang";

const UI = {
  cz: {
    quarterly: "Kvartální vyhodnocení",
    period: "Období",
    rating: "Celkové hodnocení",
    turnover: "Obrat",
    orders: "Objednávek",
    delayed: "Opožděných",
    detail: "Detailní přehled",
    issued: "Vystaveno",
    order: "Objednávka",
    price: "Cena",
    status: "Status",
    note: "Poznámka / Problém",
    internal: "Interní report hodnocení dodavatelů",
    printed: "Vytištěno",
    days: "dnů",
    noOrders: "Žádné objednávky."
  },
  en: {
    quarterly: "Quarterly evaluation",
    period: "Period",
    rating: "Overall rating",
    turnover: "Turnover",
    orders: "Orders",
    delayed: "Delayed",
    detail: "Detailed overview",
    issued: "Issued",
    order: "Order",
    price: "Price",
    status: "Status",
    note: "Note / Issue",
    internal: "Internal supplier evaluation report",
    printed: "Printed",
    days: "days",
    noOrders: "No orders."
  },
  de: {
    quarterly: "Quartalsbewertung",
    period: "Zeitraum",
    rating: "Gesamtbewertung",
    turnover: "Umsatz",
    orders: "Bestellungen",
    delayed: "Verspätet",
    detail: "Detailübersicht",
    issued: "Ausgestellt",
    order: "Bestellung",
    price: "Preis",
    status: "Status",
    note: "Notiz / Problem",
    internal: "Interner Lieferantenbewertungsbericht",
    printed: "Gedruckt",
    days: "Tage",
    noOrders: "Keine Bestellungen."
  }
};

const STATUS = {
  "Opožděno": { en:"Delayed", de:"Verspätet" },
  "Doručeno": { en:"Delivered", de:"Geliefert" }
};

function t(k){ return UI[UI_LANG]?.[k] || k; }

function trStatus(s){
  const v = String(s || "").trim();
  if(UI_LANG==="cz") return v;
  return STATUS[v]?.[UI_LANG] || v;
}

function trProblem(text){
  const s = String(text || "").trim();
  if(!s) return s;
  if(UI_LANG==="cz") return s;

  if(UI_LANG==="en") {
    return s.replace(/Zpoždění\s+(\d+)\s+dnů/i, (_,d)=>`Delay ${d} ${t("days")}`);
  }
  if(UI_LANG==="de") {
    return s.replace(/Zpoždění\s+(\d+)\s+dnů/i, (_,d)=>`Verspätung ${d} ${t("days")}`);
  }
  return s;
}

/* ================= RENDER ================= */

function render(record){
  LAST_RECORD = record;

  const raw = record?.Tiskova_Data;
  if(!raw) return;

  let data;
  try { data = JSON.parse(raw); }
  catch(e) {
    document.getElementById("report").innerHTML =
      `<div style="color:red; text-align:center; padding:50px;">CHYBA DAT:<br>${raw}</div>`;
    return;
  }

  const h = data.hlavicka;

  let html = `
    <div class="header">
      <div>
        <img src="https://www.streicher.cz/fileadmin/Vorlage/images/logo.png" class="logo-img" alt="Logo">
        <h1>${h.dodavatel}</h1>
        <div style="font-size:12px; text-transform:uppercase; color:#444;">${t("quarterly")}</div>
      </div>
      <div class="meta-date">${t("period")}: ${h.obdobi}</div>
    </div>

    <div class="dashboard">
      <div class="score">
        <div class="score-val">${h.skore_procenta} %</div>
        <div class="score-lbl">${t("rating")}</div>
      </div>

      <div class="kpis">
        <div class="alert-box">
          <div class="alert-num" style="white-space:nowrap;">${h.obrat}</div>
          <div class="alert-label">${t("turnover")}</div>
        </div>

        <div class="alert-box">
          <div class="alert-num">${h.pocet_celkem}</div>
          <div class="alert-label">${t("orders")}</div>
        </div>

        <div class="alert-box">
          <div class="alert-num">${h.pocet_zpozdenych}</div>
          <div class="alert-label">${t("delayed")}</div>
        </div>
      </div>
    </div>

    <h3>${t("detail")}</h3>
    <table>
      <thead>
        <tr>
          <th style="width:12%;">${t("issued")}</th>
          <th style="width:15%;">${t("order")}</th>
          <th style="width:18%; text-align:right;">${t("price")}</th>
          <th style="width:15%; padding-left:10px;">${t("status")}</th>
          <th style="width:40%;">${t("note")}</th>
        </tr>
      </thead>
      <tbody>
  `;

  if (data.radky && data.radky.length > 0) {
    data.radky.forEach(r => {
      const prob = r.je_problem ? `<span class="problem-text">${trProblem(r.text_problemu)}</span>` : "";
      html += `
        <tr>
          <td>${r.datum}</td>
          <td>${r.cislo}</td>
          <td style="text-align:right;">${r.cena}</td>
          <td style="padding-left:10px;">${trStatus(r.status)}</td>
          <td>${prob}</td>
        </tr>
      `;
    });
  } else {
    html += `<tr><td colspan="5" style="text-align:center; padding:20px;">${t("noOrders")}</td></tr>`;
  }

  html += `
      </tbody>
    </table>

    <div class="footer">
      <span>${t("internal")}</span>
      <span>${t("printed")}: ${new Date().toLocaleDateString()}</span>
    </div>
  `;

  document.getElementById("report").innerHTML = html;
}

/* ================= INIT ================= */

const sel = document.getElementById("langSelect");
try {
  const stored = localStorage.getItem(LS_KEY);
  if (stored === "cz" || stored === "en" || stored === "de") UI_LANG = stored;
} catch(e) {}

sel.value = UI_LANG;

sel.addEventListener("change", () => {
  UI_LANG = sel.value;
  try { localStorage.setItem(LS_KEY, UI_LANG); } catch(e) {}
  if (LAST_RECORD) render(LAST_RECORD);
});

grist.ready({ columns:["Tiskova_Data"], requiredAccess:"read table" });
grist.onRecord(render);
</script>

</body>
</html>
