<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Kvartální Hodnocení</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    body { font-family: 'Segoe UI', sans-serif; background:#f0f0f0; margin:0; padding:20px; color:#000; }

    .page {
      background:#fff;
      width:210mm;
      min-height:297mm;
      margin:0 auto 20px;
      padding:20mm;
      box-shadow:0 0 10px rgba(0,0,0,.1);
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
    }

    @media print {
      body { background:none; padding:0; }
      .page { box-shadow:none; margin:0; padding:15mm; }
      .no-print { display:none!important; }
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }

    .header {
      border-bottom:2px solid #000;
      padding-bottom:10px;
      margin-bottom:30px;
      display:flex;
      justify-content:space-between;
    }

    .logo-img {
      height:90px;
      max-width:300px;
      object-fit:contain;
      margin-bottom:10px;
    }

    h1 { margin:0; font-size:24px; text-transform:uppercase; }

    .dashboard {
      display:flex;
      gap:30px;
      margin-bottom:30px;
    }

    .score {
      flex:0 0 30%;
      background:#f4f4f4;
      border-left:6px solid #000;
      padding:15px;
    }

    .score-val { font-size:36px; font-weight:bold; }
    .score-lbl { font-size:11px; text-transform:uppercase; color:#555; }

    .kpis {
      flex:1;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }

    .kpi {
      border:1px solid #000;
      padding:10px;
      text-align:center;
    }

    table {
      width:100%;
      border-collapse:collapse;
      font-size:11px;
    }

    th, td {
      border:1px solid #000;
      padding:6px;
    }

    th {
      background:#eee;
      text-transform:uppercase;
    }

    .problem-text { font-weight:bold; }

    .footer {
      margin-top:auto;
      border-top:1px solid #000;
      padding-top:10px;
      font-size:10px;
      display:flex;
      justify-content:space-between;
    }

    .langbar {
      max-width:210mm;
      margin:0 auto 10px;
      display:flex;
      justify-content:center;
      gap:10px;
      font-weight:bold;
    }

    .btn-print {
      width:220px;
      margin:0 auto 20px;
      padding:10px;
      background:#333;
      color:#fff;
      text-align:center;
      cursor:pointer;
      border-radius:5px;
    }
  </style>
</head>

<body>

<!-- Language select -->
<div class="no-print langbar">
  <label>
    Jazyk:
    <select id="langSelect">
      <option value="cz">CZ</option>
      <option value="en">EN</option>
      <option value="de">DE</option>
    </select>
  </label>
</div>

<div class="no-print btn-print" onclick="window.print()">🖨️ Print</div>

<div class="page" id="report">
  <div style="text-align:center; padding-top:150px; color:#888;">Načítám data…</div>
</div>

<script>
/* ================= LANGUAGE ================= */

let UI_LANG = "cz";
let LAST_RECORD = null;
const LS_KEY = "kvartal_lang";

const UI = {
  cz: {
    quarterly: "Kvartální vyhodnocení",
    period: "Období",
    rating: "Celkové hodnocení",
    turnover: "Obrat",
    orders: "Objednávek",
    delayed: "Opožděných",
    detail: "Detailní přehled",
    issued: "Vystaveno",
    order: "Objednávka",
    price: "Cena",
    status: "Status",
    note: "Poznámka / Problém",
    internal: "Interní report hodnocení dodavatelů",
    printed: "Vytištěno",
    days: "dnů",
    noOrders: "Žádné objednávky."
  },
  en: {
    quarterly: "Quarterly evaluation",
    period: "Period",
    rating: "Overall rating",
    turnover: "Turnover",
    orders: "Orders",
    delayed: "Delayed",
    detail: "Detailed overview",
    issued: "Issued",
    order: "Order",
    price: "Price",
    status: "Status",
    note: "Note / Issue",
    internal: "Internal supplier evaluation report",
    printed: "Printed",
    days: "days",
    noOrders: "No orders."
  },
  de: {
    quarterly: "Quartalsbewertung",
    period: "Zeitraum",
    rating: "Gesamtbewertung",
    turnover: "Umsatz",
    orders: "Bestellungen",
    delayed: "Verspätet",
    detail: "Detailübersicht",
    issued: "Ausgestellt",
    order: "Bestellung",
    price: "Preis",
    status: "Status",
    note: "Notiz / Problem",
    internal: "Interner Lieferantenbewertungsbericht",
    printed: "Gedruckt",
    days: "Tage",
    noOrders: "Keine Bestellungen."
  }
};

const STATUS = {
  "Opožděno": { en:"Delayed", de:"Verspätet" },
  "Doručeno": { en:"Delivered", de:"Geliefert" }
};

function t(k){ return UI[UI_LANG][k] || k; }

function trStatus(s){
  if(UI_LANG==="cz") return s;
  return STATUS[s]?.[UI_LANG] || s;
}

function trProblem(text){
  if(UI_LANG==="cz") return text;
  return text.replace(/Zpoždění (\d+) dnů/i, (_,d)=>`Delay ${d} ${t("days")}`);
}

/* ================= RENDER ================= */

function render(record){
  LAST_RECORD = record;
  const raw = record?.Tiskova_Data;
  if(!raw) return;

  const data = JSON.parse(raw);
  const h = data.hlavicka;

  let html = `
    <div class="header">
      <div>
        <img src="https://www.streicher.cz/fileadmin/Vorlage/images/logo.png" class="logo-img">
        <h1>${h.dodavatel}</h1>
        <div>${t("quarterly")}</div>
      </div>
      <div>${t("period")}: ${h.obdobi}</div>
    </div>

    <div class="dashboard">
      <div class="score">
        <div class="score-val">${h.skore_procenta} %</div>
        <div class="score-lbl">${t("rating")}</div>
      </div>

      <div class="kpis">
        <div class="kpi"><b>${h.obrat}</b><br>${t("turnover")}</div>
        <div class="kpi"><b>${h.pocet_celkem}</b><br>${t("orders")}</div>
        <div class="kpi"><b>${h.pocet_zpozdenych}</b><br>${t("delayed")}</div>
      </div>
    </div>

    <h3>${t("detail")}</h3>
    <table>
      <thead>
        <tr>
          <th>${t("issued")}</th>
          <th>${t("order")}</th>
          <th>${t("price")}</th>
          <th>${t("status")}</th>
          <th>${t("note")}</th>
        </tr>
      </thead>
      <tbody>
  `;

  if(data.radky.length){
    data.radky.forEach(r=>{
      html+=`
        <tr>
          <td>${r.datum}</td>
          <td>${r.cislo}</td>
          <td style="text-align:right">${r.cena}</td>
          <td>${trStatus(r.status)}</td>
          <td>${r.je_problem ? `<span class="problem-text">${trProblem(r.text_problemu)}</span>` : ""}</td>
        </tr>`;
    });
  } else {
    html+=`<tr><td colspan="5" style="text-align:center">${t("noOrders")}</td></tr>`;
  }

  html+=`
      </tbody>
    </table>

    <div class="footer">
      <span>${t("internal")}</span>
      <span>${t("printed")}: ${new Date().toLocaleDateString()}</span>
    </div>
  `;

  document.getElementById("report").innerHTML = html;
}

/* ================= INIT ================= */

const sel = document.getElementById("langSelect");
UI_LANG = localStorage.getItem(LS_KEY) || "cz";
sel.value = UI_LANG;

sel.addEventListener("change", ()=>{
  UI_LANG = sel.value;
  localStorage.setItem(LS_KEY, UI_LANG);
  if(LAST_RECORD) render(LAST_RECORD);
});

grist.ready({ columns:["Tiskova_Data"], requiredAccess:"read table" });
grist.onRecord(render);
</script>

</body>
</html>
